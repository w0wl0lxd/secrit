[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { crate = "serde_yaml", reason = "deprecated (PLAN section 12)" },
  { crate = "serde_yml", reason = "RUSTSEC-2025-0068 (PLAN section 12)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
