name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  # One job for the cargo gates, so the devShell and the dependencies are
  # built once (CI-1). The devShell puts the Nix sops, age, ssh-keygen and
  # util-linux on PATH and sets the SECRIT_TEST_* variables.
  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix develop -c cargo fmt --all --check
      - run: nix develop -c cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: nix develop -c cargo clippy --all-targets --locked -- -D warnings
      - run: nix develop -c cargo nextest run --all-features --locked
      - run: nix develop -c cargo deny check
  # macOS cfg errors without a Mac: clippy does not link, so it needs no Apple
  # SDK. The devShell rustc has no darwin std, so rustup supplies it.
  darwin-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: rustup target add aarch64-apple-darwin
      - run: cargo clippy --all-targets --all-features --locked --target aarch64-apple-darwin -- -D warnings
  # The flake checks: the package, the sandbox test run, the module check.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix flake check -L
